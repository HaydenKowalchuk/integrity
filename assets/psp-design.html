<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>PSP Design Icons</title>

    <style>
      .blue_bg {
        width: 480px;
        height: 272px;
        background-color: #269;
        background-image: linear-gradient(white 2px, transparent 2px), linear-gradient(90deg, white 2px, transparent 2px), linear-gradient(rgba(255, 255, 255, 0.3) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.3) 1px, transparent 1px);

        /* 80px main cells with 16px inner sub-boxes (5x5 grid) */
        background-size:
          80px 80px,
          80px 80px,
          16px 16px,
          16px 16px;

        /* Centers the pattern so left/right and top/bottom edges are perfectly symmetrical */
        background-position: center center;

        /* Cutting guide border */
        box-sizing: content-box;
        border: 1px solid #ff4500;
      }
      .icon0 {
        width: 144px;
        height: 80px;
      }

      .pic0 {
        width: 310px;
        height: 180px;
      }

      .pic1 {
        width: 480px;
        height: 272px;
      }

      .border {
        box-sizing: content-box;
        border: 1px solid #ff4500;
      }

      .icon0 img {
        width: 100%;
        height: auto;
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <div class="icon0 border">
      <img src="../images/Integrity_XL_trans_black.png" />
    </div>
    <hr />
    <div class="pic0 border"></div>
    <hr />
    <div class="pic1 blue_bg border"></div>
  </body>
</html>
